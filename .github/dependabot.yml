version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/hallucination-detector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/undecryptable-prover"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/crypto-time-ledger"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # 注：crypto-time-machine 仅用 Python 标准库，无第三方依赖，不配 dependabot。
