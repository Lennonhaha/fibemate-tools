name: detector-ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Run the detector test suites (samples + contract + mutation self-test)
        working-directory: hallucination-detector
        run: npm test
      - name: Check whitelist version stamps
        run: node scripts/check-whitelist-version.js
