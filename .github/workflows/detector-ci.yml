name: detector-ci

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Run sample tests (zero-dependency static analysis)
        working-directory: hallucination-detector
        run: node test/sample.test.js
      - name: Check whitelist version stamps
        run: node scripts/check-whitelist-version.js
