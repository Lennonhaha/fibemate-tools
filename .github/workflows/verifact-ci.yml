name: verifact-ci

on:
  pull_request:
    paths:
      - 'verifact/**'
      - '.github/workflows/verifact-ci.yml'
  workflow_dispatch:

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Unit + regression tests
        working-directory: verifact
        run: node test/run.js
      - name: CLI end-to-end on clean fixture（门禁应为 PASS）
        working-directory: verifact
        run: node bin/verifact.js verify --docs test/fixtures/docs/good.md --no-cache --fail-on drift
      - name: CLI end-to-end on reporting fixture（应命中 drift 并以 1 退出）
        working-directory: verifact
        run: |
          set +e
          node bin/verifact.js verify --docs test/fixtures/docs/report.md --artifacts test/fixtures/artifacts --no-cache --fail-on drift
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 (drift present), got $code"
            exit 1
          fi

  # #111: the unit suite only ever scanned test/fixtures, so a parser bug could
  # ship green. This job runs the gate against a committed corpus of real-shaped
  # documents and then mutates one number to prove the gate can still go red.
  gate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Gate on the committed corpus (clean baseline)
        working-directory: verifact
        run: |
          node bin/verifact.js verify --docs test/corpus/docs --artifacts test/corpus/artifacts --no-cache --fail-on drift --format json --out /tmp/corpus.json
          node -e "
            const r = require('/tmp/corpus.json');
            console.log('docs scanned: ' + r.counts.docs + ', claims: ' + r.counts.claims + ', verified: ' + r.counts.verified + ', drift: ' + r.counts.drift);
            if (r.counts.docs === 0) { console.error('0 documents scanned is never a pass'); process.exit(1); }
            if (r.counts.claims === 0) { console.error('0 claims extracted is never a pass'); process.exit(1); }
            if (r.counts.drift !== 0 || r.gate.failed) { console.error('corpus baseline is not clean'); process.exit(1); }
          "
      - name: Mutation check (a changed number must turn the gate red)
        working-directory: verifact
        run: |
          rm -rf /tmp/corpus-mut && cp -r test/corpus /tmp/corpus-mut
          sed -i 's/99\.1%/97.3%/' /tmp/corpus-mut/docs/status.md
          set +e
          node bin/verifact.js verify --docs /tmp/corpus-mut/docs --artifacts /tmp/corpus-mut/artifacts --no-cache --fail-on drift --format json --out /tmp/corpus-mut.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 after mutating a claim, got $code"
            exit 1
          fi
          node -e "
            const r = require('/tmp/corpus-mut.json');
            console.log('mutated run: docs ' + r.counts.docs + ', drift ' + r.counts.drift);
            if (r.counts.drift < 1) { console.error('mutation did not produce drift'); process.exit(1); }
          "

  # 只对 verifact 自身的文档做稿规自检；不改仓库里任何既有文件。
  self-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: 稿规自检（high 级应命中规则自身的例句，medium 级不应命中）
        working-directory: verifact
        run: |
          set +e
          node bin/verifact.js verify --docs README.md --no-cache --fail-on none --format json --out /tmp/self.json
          set -e
          node -e "
            const r = require('/tmp/self.json');
            const medium = r.lint.filter(f => f.severity === 'medium');
            if (medium.length) {
              console.error('README 命中 medium 级用语线索：');
              medium.forEach(f => console.error('  ' + f.file + ':' + f.line + ' ' + f.ruleId + ' ' + f.matched));
              process.exit(1);
            }
            console.log('self-lint ok, findings=' + r.lint.length);
          "
