# Build the prover on both platforms, run the built binary, and publish the
# binaries with digests attached to a GitHub release.
#
# Why each job exists:
#   - a cross-compiled binary that is never executed is a guess, so each runner
#     builds natively and then runs its own artifact with fixed parameters and
#     requires the evidence line to appear in the output;
#   - the tests run with --release because the interesting failure mode (dead
#     code elimination removing the overwrite loop) only exists in optimised
#     builds;
#   - the release job only publishes what the build job already ran, and ships
#     a SHA256SUMS next to the binaries so a downloader can check them.

name: prover-binaries

on:
  push:
    tags:
      - 'undecryptable-prover-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rehearse, example undecryptable-prover-v0.1.0 (a dispatch never publishes)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build and run (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            exe: ''
          - os: windows-latest
            artifact: windows-x86_64
            exe: '.exe'
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The binaries must be built from the tagged tree. A dispatch without this
          # built the branch it was started from and published it under a tag name.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: The checked-out tree is the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_SHA="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          test -n "$TAG_SHA" || { echo "::error::tag $TAG does not exist"; exit 1; }
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "tag=$TAG tag_commit=$TAG_SHA head=$HEAD_SHA"
          test "$TAG_SHA" = "$HEAD_SHA" || { echo "::error::HEAD is not the tag commit ($HEAD_SHA != $TAG_SHA)"; exit 1; }

      - name: Show the Rust toolchain the runner ships with
        run: |
          rustc --version
          cargo --version

      - name: Tests (release profile - DCE only matters when optimised)
        working-directory: undecryptable-prover
        run: cargo test --release --locked

      - name: Build the release binary
        working-directory: undecryptable-prover
        run: cargo build --release --locked

      - name: Run the built binary and demand the evidence line
        shell: bash
        working-directory: undecryptable-prover
        run: |
          set -euo pipefail
          BIN="target/release/undecryptable-prover${{ matrix.exe }}"
          test -f "$BIN" || { echo "no binary at $BIN" >&2; exit 1; }
          OUT="$("$BIN" --len 32 --rounds 3)"
          echo "$OUT"
          echo "$OUT" | grep -q 'final: buffer is all-zero after 3 rounds'
          echo "$OUT" | grep -q 'evidence only, not a proof'
          test -f evidence.json
          echo "executed $BIN natively on ${{ matrix.os }}"

      - name: Copy the binary and record its digest
        shell: bash
        working-directory: undecryptable-prover
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          BIN="target/release/undecryptable-prover${{ matrix.exe }}"
          OUT="$GITHUB_WORKSPACE/dist/undecryptable-prover-${{ matrix.artifact }}${{ matrix.exe }}"
          cp "$BIN" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload the binary and its digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prover-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # A tag push, and nothing else. A dispatch rehearses both builds and stops here;
    # the previous gate compared a boolean input to the string 'true'.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every published file
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum undecryptable-prover-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "undecryptable-prover ${TAG##*-v}" \
              --notes "Binaries built and executed on their own platform before upload (see the build jobs). Each file has a sha256 in SHA256SUMS."
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  rehearsal:
    needs: build
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Nothing was published
        run: |
          echo "not a tag push: both binaries were built and executed, no release was created"
