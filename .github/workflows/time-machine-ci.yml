name: time-machine-ci

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crypto-time-machine/**'
      - '.github/workflows/time-machine-ci.yml'

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CI test (self-contained temp repo, zero external deps)
        working-directory: crypto-time-machine
        run: python test/ci_test.py
