name: xdiff

on:
  push:
    paths:
      - 'verifact/**'
      - 'xdiff/**'
      - '.github/workflows/xdiff-ci.yml'
  pull_request:
    paths:
      - 'xdiff/**'
      - '.github/workflows/xdiff-ci.yml'
  workflow_dispatch:

jobs:
  unit:
    name: 回归与语法（降级）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: 语法检查
        working-directory: xdiff
        run: |
          for f in $(find src bin -name '*.js'); do node --check "$f" || exit 1; done
      - name: 回归
        working-directory: xdiff
        run: node test/run.js

  graceful:
    name: 实现缺失时优雅降级
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # CI runner 上没有 D:\FIBEMATE，所有实现都应报 unavailable。
      # 这一条保证工具在找不到实现时给出可读报告并正常退出，而不是崩溃。
      - name: 降级跑一次
        working-directory: xdiff
        run: |
          node bin/xdiff.js run --fail-on none --format json --out .xdiff/ci.json
          node test/ci-check.js
      - name: 报告归档
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xdiff-ci-report
          path: xdiff/.xdiff/ci.json
