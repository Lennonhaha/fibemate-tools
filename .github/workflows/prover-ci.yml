name: prover-ci

on:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Build (release) and run evidence generation
        working-directory: undecryptable-prover
        run: |
          cargo build --release
          ./target/release/undecryptable-prover
          test -f evidence.json && echo "evidence.json produced"
