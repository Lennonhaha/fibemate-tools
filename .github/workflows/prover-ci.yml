name: prover-ci

on:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Build (release) and run evidence generation
        working-directory: undecryptable-prover
        run: |
          cargo build --release
          ./target/release/undecryptable-prover
          test -f evidence.json && echo "evidence.json produced"
