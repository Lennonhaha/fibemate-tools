name: prover-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Format and lint
        working-directory: undecryptable-prover
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Tests (release; dead-code elimination only happens with optimisations)
        working-directory: undecryptable-prover
        run: cargo test --release
      - name: Build (release) and run evidence generation
        working-directory: undecryptable-prover
        run: |
          cargo build --release
          ./target/release/undecryptable-prover
          test -f evidence.json && echo "evidence.json produced"
      # The Lean proof is part of "build-and-run": a theorem that is not compiled
      # is not a theorem. Pinned to lean-action v1.6.2 by commit SHA, and the
      # toolchain is pinned by lean-toolchain, so neither can drift silently.
      - name: Lean proof with axiom audit
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: undecryptable-prover/proof
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          # Fails on anything outside this list, which covers `sorry` (sorryAx),
          # `native_decide` (Lean.ofReduceBool), and any newly added axiom.
          # `propext` is Lean core logic: every structure gets a generated
          # `mk.injEq` lemma whose `↔` statement needs propositional
          # extensionality. Allowing it is not an assumption about the world.
          # The only domain assumption is the storage-medium threat model below;
          # widening this list is a deliberate, reviewable change.
          axiom-audit: "true"
          axiom-audit-allow: "propext,UndecryptableProver.overwrite_erases"
          axiom-audit-root: "UndecryptableProver"
