name: prover-ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Format and lint
        working-directory: undecryptable-prover
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Tests (release; dead-code elimination only happens with optimisations)
        working-directory: undecryptable-prover
        run: cargo test --release
      - name: Build (release) and run evidence generation
        working-directory: undecryptable-prover
        run: |
          cargo build --release
          ./target/release/undecryptable-prover
          test -f evidence.json && echo "evidence.json produced"
      # releases.lean-lang.org intermittently refuses the TLS handshake for the
      # pinned toolchain tarball. lean-action installs elan and then resolves
      # lean-toolchain, and that resolution is where the download happens, so a
      # transient refusal reds a pull request that does not touch Lean at all
      # (2026-10-28: four refusals and one 22 minute hang, on docs-only PRs).
      # Install the toolchain here first, with a bounded retry, so the action
      # finds it present and never downloads it. scripts/test-lean-retry.cjs
      # keeps this step from being deleted, reordered, or defused.
      - name: Pre-install the pinned Lean toolchain (retry the flaky release CDN)
        working-directory: undecryptable-prover/proof
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < lean-toolchain)"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none

          installed=0
          for attempt in 1 2 3 4 5; do
            if "$HOME/.elan/bin/elan" toolchain install "$toolchain"; then
              installed=1
              break
            fi
            echo "::warning::Lean toolchain download failed (attempt $attempt/5); retrying in 15s"
            sleep 15
          done
          test "${installed:-0}" = 1
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The Lean proof is part of "build-and-run": a theorem that is not compiled
      # is not a theorem. Pinned to lean-action v1.6.2 by commit SHA, and the
      # toolchain is pinned by lean-toolchain, so neither can drift silently.
      - name: Lean proof with axiom audit
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: undecryptable-prover/proof
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          # Fails on anything outside this list, which covers `sorry` (sorryAx),
          # `native_decide` (Lean.ofReduceBool), and any newly added axiom.
          # `propext` is Lean core logic: every structure gets a generated
          # `mk.injEq` lemma whose `↔` statement needs propositional
          # extensionality. Allowing it is not an assumption about the world.
          # The only domain assumption is the storage-medium threat model below;
          # widening this list is a deliberate, reviewable change.
          axiom-audit: "true"
          axiom-audit-allow: "propext,UndecryptableProver.overwrite_erases"
          axiom-audit-root: "UndecryptableProver"
